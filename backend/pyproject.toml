[project]
name = "muse-backend"
version = "0.1.0"
description = "Muse 后端：FastAPI 分层骨架、多租户、AI 编排底座"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "argon2-cffi",
    "arq>=0.25.0",
    "fastapi[standard]",
    "greenlet>=3.5.4",
    "openai",
    "pgvector",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt[crypto]",
    "redis>=8.0.1",
    "sqlalchemy>=2.0",
    "sse-starlette>=3.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muse"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic 自动生成的迁移文件是生成物，不适用手写代码的 lint 规则。
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["muse"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Story 5.2 review E6 patch：标记「真实跑通 pipeline 不 mock」的测试（E1+E2 回归防线）。
markers = [
    "real_pipeline: 跳过 autouse 的 run_chapter_pipeline mock，让真实 pipeline 跑起来（只 mock provider 不打真实 LLM）",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

# 国内镜像：直连 pypi.org 下行极慢（实测 ~46KB/s），走清华镜像（实测 ~4.8MB/s）。
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
